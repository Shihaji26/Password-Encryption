<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strong Password Sign Up (HTML + CSS only)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #ffffff;
      width: 360px;
      max-width: 90vw;
      border-radius: 10px;
      padding: 26px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    p.hint {
      font-size: 13px;
      color: #555;
      margin: 0 0 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 12px 0 4px;
    }

    input {
      width: 100%;
      padding: 9px 10px;
      font-size: 14px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }

    /* Turn the border red only once the user has actually typed something invalid */
    input:not(:placeholder-shown):invalid {
      border-color: #dc2626;
      background: #fef2f2;
    }

    /* Turn it green once the value satisfies the pattern */
    input:not(:placeholder-shown):valid {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    ul.rules {
      font-size: 12.5px;
      color: #555;
      margin: 10px 0 0;
      padding-left: 18px;
    }

    ul.rules li {
      margin-bottom: 3px;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: #fff;
      font-size: 14.5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create account</h1>
    <p class="hint">Pure HTML + CSS &mdash; no JavaScript. The browser itself refuses to submit until the password matches every rule below.</p>

    <form>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required placeholder=" " />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        placeholder=" "
        minlength="8"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
        title="Must be at least 8 characters and include an uppercase letter, a lowercase letter, a number, and a special character."
      />

      <ul class="rules">
        <li>At least 8 characters</li>
        <li>At least one lowercase letter</li>
        <li>At least one UPPERCASE letter</li>
        <li>At least one number</li>
        <li>At least one special character (e.g. ! @ # $)</li>
      </ul>

      <button type="submit">Create account</button>
    </form>
  </main>
</body>
</html>
